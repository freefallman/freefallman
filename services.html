    <style>
/* NAV BAR - Slimmer & Sleeker */
#header, #header.alt {
    background-color: #0A1F2F !important;
    height: 3.5em; /* Reduced height */
    line-height: 3.5em; /* Centers text vertically */
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 10000;
}

#header h1 {
    height: 3.5em;
    line-height: 3.5em;
    left: 1.25em;
}

#header nav {
    right: 1.25em;
    height: 3.5em;
    line-height: 3.5em;
}

/* BODY - Adjusted for the slimmer nav */
body, #page-wrapper {
    background-color: #0A1F2F !important;
    padding-top: 3.5em; /* Matches new header height */
}

/* HERO IMAGE - Maximum Screen Presence */
.hero-image {
    margin: 0;
    padding: 0;
    background-color: #0A1F2F;
    overflow: hidden;
    line-height: 0; /* Removes tiny gap at bottom of images */
}

.full-flyer {
    width: 100%;
    height: auto;
    /* This calculates height based on the viewport minus the header */
    max-height: calc(100vh - 3.5em); 
    display: block;
    margin: 0 auto;
    object-fit: contain; 
}

/* TEXT SECTION - Clean transitions */
.wrapper.style5 {
    background-color: #0A1F2F !important;
    color: #E6EEF4 !important;
    padding: 3em 0 !important; /* Slightly tighter padding */
}

.wrapper.style5 .major h2 {
    color: #0077B6 !important;
    font-size: 2.5rem !important; /* Scaled down for better hierarchy */
    font-weight: 700;
    letter-spacing: 0.05em;
}

/* Content inside the box */
.wrapper.style5 h3, .wrapper.style5 h4 {
    color: #0077B6 !important;
}

.wrapper.style5 p, .wrapper.style5 li {
    color: #E6EEF4 !important;
    line-height: 1.7;
}

hr {
    border-bottom: solid 1px #0077B6 !important;
}
    </style>
